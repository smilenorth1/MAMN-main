name: MAMN_x3
model_type: SRModel
scale: 3
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set5/image_SRF_3/HR
    dataroot_lq: datasets/benchmark/Set5/image_SRF_3/LR
#    filename_tmpl: '{}x3'
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_2:  # the 2nd test dataset
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set14/image_SRF_3/HR
    dataroot_lq: datasets/benchmark/Set14/image_SRF_3/LR
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_3:  # the 1st test dataset
    name: B100
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/BSD100/image_SRF_3/HR
    dataroot_lq: datasets/benchmark/BSD100/image_SRF_3/LR
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_4:  # the 2nd test dataset
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Urban100/image_SRF_3/HR
    dataroot_lq: datasets/benchmark/Urban100/image_SRF_3/LR
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_5:  # the 1st test dataset
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Manga109/image_SRF_3/HR
    dataroot_lq: datasets/benchmark/Manga109/image_SRF_3/LR
    filename_tmpl: '{}'
    io_backend:
      type: disk

#  test_6:
#    name: DIV2K_val100
#    type: PairedImageDataset
#    dataroot_gt: datasets/DIV2K/DIV2K_Valid/HR
#    dataroot_lq: datasets/DIV2K/DIV2K_Valid/LR_bicubic/X3
#    filename_tmpl: '{}x3'
#    io_backend:
#      type: disk

# network structures
network_g:
  type: MAMN
  dim: 36
  n_blocks: 8
  ffn_scale: 2.0
  upscaling_factor: 3

# path
path:
  pretrain_network_g: experiments/pretrained_models/MAMN_x3.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 3
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 3
      test_y_channel: true
